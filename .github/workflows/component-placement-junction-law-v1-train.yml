name: Component-Placement Junction Law v1 — Train Discovery

on:
  pull_request:
    paths:
      - "research/mark/discovery-experiments/component-placement-junction-law-v1.*"
      - "scripts/prepare-component-placement-map-v1.py"
      - "scripts/measure-component-placement-junction-v1.py"
      - "scripts/analyze-component-placement-junction-train-v1.py"
      - "scripts/prepare-whole-topology-condition-v1.py"
      - "crates/mark-sparse-compiler/src/**"
      - ".github/workflows/component-placement-junction-law-v1-train.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEALED_RUN_ID: "33755743472"
      SEALED_ARTIFACT: "mark-source-rule-atlas-v1-sealed-evidence"
      SEALED_INPUT: "artifact-staging/sealed-evidence/mark-conveyor-input-v1/mark-observable-input-blind-v1.compiler.json"
      CAPTURES_DIR: "artifact-staging/sealed-evidence/mark-conveyor-input-v1/captures"
      EXCLUDED: "research/mark/discovery-experiments/independent-source-law-discovery-v1.source-selection.json"
      PROTOCOL: "research/mark/discovery-experiments/component-placement-junction-law-v1.protocol.json"
      PLACEMENT_RUN_ID: "33794464849"
      PLACEMENT_ARTIFACT: "mark-masked-slot-substitutability-v1-frozen"

    steps:
      - uses: actions/checkout@v4

      - name: Validate frozen experiment files
        run: |
          python3 -m json.tool "$PROTOCOL" >/dev/null
          python3 -m py_compile scripts/prepare-component-placement-map-v1.py
          python3 -m py_compile scripts/prepare-whole-topology-condition-v1.py
          python3 -m py_compile scripts/measure-component-placement-junction-v1.py
          python3 -m py_compile scripts/analyze-component-placement-junction-train-v1.py
          cargo test --manifest-path crates/mark-sparse-compiler/Cargo.toml --bin mark-sparse-compiler

      - name: Download exact sealed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact-staging/sealed-evidence
          gh run download "$SEALED_RUN_ID" --repo "${{ github.repository }}" --name "$SEALED_ARTIFACT" --dir artifact-staging/sealed-evidence

      - name: Download frozen masked-placement artifact only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact-staging/masked-placement
          gh run download "$PLACEMENT_RUN_ID" --repo "${{ github.repository }}" --name "$PLACEMENT_ARTIFACT" --dir artifact-staging/masked-placement

      - name: Freeze placement token map
        run: |
          python3 scripts/prepare-component-placement-map-v1.py \
            --occurrences artifact-staging/masked-placement/masked-slot-occurrences.jsonl \
            --protocol "$PROTOCOL" \
            --out artifacts/cpjl-v1/placement-map.json

      - name: Prepare untouched train sources only
        run: |
          python3 scripts/prepare-whole-topology-condition-v1.py \
            --sealed-input "$SEALED_INPUT" \
            --captures-dir "$CAPTURES_DIR" \
            --excluded-selection "$EXCLUDED" \
            --lane train \
            --out artifacts/cpjl-v1/inputs/train

      - name: Build placement-conditioned compiler
        run: cargo build --release --manifest-path crates/mark-sparse-compiler/Cargo.toml --bin mark-sparse-compiler

      - name: Compile and measure train sources independently
        shell: bash
        run: |
          set -euo pipefail
          input_root="artifacts/cpjl-v1/inputs/train"
          out_root="artifacts/cpjl-v1/train"
          mkdir -p "$out_root"
          python3 - "$input_root/manifest.json" > "$out_root/sources.tsv" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          for s in d["sources"]:
              print(s["sourceGroupId"]+"\t"+s["localBlindInputSha256"])
          PY
          : > "$out_root/source-metrics.jsonl"
          while IFS=$'\t' read -r sid local_sha; do
            tmp="$RUNNER_TEMP/cpjl-train-$sid"
            rm -rf "$tmp"; mkdir -p "$tmp"
            if ! (
              ulimit -v 524288
              crates/mark-sparse-compiler/target/release/mark-sparse-compiler compile \
                --input "$input_root/$sid/input.json" \
                --out "$tmp/compiler" \
                --tile 512 --overlap 32 --null-iterations 64 --min-sources 1 \
                --condition-degree \
                --placement-map artifacts/cpjl-v1/placement-map.json
            ) > "$tmp/runtime.txt" 2>&1; then
              cat "$tmp/runtime.txt"; exit 1
            fi
            python3 scripts/measure-component-placement-junction-v1.py \
              --compiler-out "$tmp/compiler" --source-id "$sid" --lane train \
              --local-input-sha "$local_sha" --protocol "$PROTOCOL" \
              >> "$out_root/source-metrics.jsonl"
            rm -rf "$tmp"
          done < "$out_root/sources.tsv"

      - name: Freeze train placement-law catalogue
        run: |
          python3 scripts/analyze-component-placement-junction-train-v1.py \
            --metrics-glob "artifacts/cpjl-v1/train/source-metrics.jsonl" \
            --placement-map artifacts/cpjl-v1/placement-map.json \
            --protocol "$PROTOCOL" \
            --out artifacts/cpjl-v1/train/train-catalogue.json
          cp artifacts/cpjl-v1/inputs/train/manifest.json artifacts/cpjl-v1/train/input-manifest.json
          python3 - artifacts/cpjl-v1/placement-map.json > artifacts/cpjl-v1/train/placement-custody.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          keep={k:d[k] for k in ["schema","status","occurrenceRowsSha256","occurrenceRows","placementField","targetTopologyExcluded","occupantTokenUsed","familyIdUsed","provenanceOpened","laneOccurrenceCounts","sourceCount","placementMapSha256"]}
          keep["placementTokenCount"]=len(d["tokenKeys"])
          print(json.dumps(keep,indent=2))
          PY

      - name: Publish compact train summary
        run: |
          python3 - artifacts/cpjl-v1/train/train-catalogue.json >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print("### Component-Placement Junction Law v1 — TRAIN ONLY")
          print(f"- Catalogue SHA-256: `{d['catalogueSha256']}`")
          print(f"- Admitted candidates: {len(d['catalogue'])}")
          print(f"- Mixed tested cells: {sum(x['classification']=='MIXED' for x in d['diagnostics'])}")
          print(f"- Placement tokens: {d['placementTokenCount']}")
          print("- Holdout/control placement-law joins remain unopened.")
          PY

      - name: Upload frozen train result
        uses: actions/upload-artifact@v4
        with:
          name: component-placement-junction-law-v1-train
          path: artifacts/cpjl-v1/train/**
          if-no-files-found: error
          retention-days: 30
