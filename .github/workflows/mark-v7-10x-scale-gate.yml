name: Mark v7 10x Scale Gate

on:
  pull_request:
    paths:
      - "crates/mark-sparse-compiler/**"
      - "scripts/harvest-mark-sources.mjs"
      - "scripts/propose-mark-observables.mjs"
      - "scripts/expand-mark-open-access-feed.mjs"
      - "scripts/expand-mark-iiif-feed.mjs"
      - "scripts/compose-mark-real-corpus-challenge.mjs"
      - "research/mark/harvest-feeds/cleveland-firehose-train-10x.v1.json"
      - "research/mark/harvest-feeds/bsb-iiif-holdout-10x.v1.json"
      - "research/mark/harvest-feeds/loc-photos-control-10x.v1.json"
      - ".github/workflows/mark-v7-10x-scale-gate.yml"

permissions:
  contents: read

jobs:
  ten-x-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MARK_V7_OUT: artifacts/mark-v7-10x
      MARK_V7_MAX_RSS_KB: 524288
      MARK_V7_MIN_LANE_SOURCES: 216
      MARK_V7_MIN_OBSERVATIONS: 20000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install acquisition dependencies
        run: npm install
      - name: Validate scale-gate source
        run: |
          rustc --version
          cargo --version
          cargo check --manifest-path crates/mark-sparse-compiler/Cargo.toml
      - name: Expand 10x heterogeneous feeds
        run: |
          MARK_OPEN_ACCESS_FEED_REQUEST=research/mark/harvest-feeds/cleveland-firehose-train-10x.v1.json MARK_OPEN_ACCESS_FEED_OUT=artifacts/v7-10x-feed-cleveland node scripts/expand-mark-open-access-feed.mjs
          MARK_IIIF_FEED_REQUEST=research/mark/harvest-feeds/bsb-iiif-holdout-10x.v1.json MARK_IIIF_FEED_OUT=artifacts/v7-10x-feed-bsb node scripts/expand-mark-iiif-feed.mjs
          MARK_OPEN_ACCESS_FEED_REQUEST=research/mark/harvest-feeds/loc-photos-control-10x.v1.json MARK_OPEN_ACCESS_FEED_OUT=artifacts/v7-10x-feed-loc node scripts/expand-mark-open-access-feed.mjs
      - name: Compose sealed 10x transfer packet
        env:
          MARK_CHALLENGE_ID: mark:v7:heterogeneous-sparse-10x-v1
          MARK_CHALLENGE_MANIFESTS: artifacts/v7-10x-feed-cleveland/generated-harvest-manifest.v1.json,artifacts/v7-10x-feed-bsb/generated-harvest-manifest.v1.json,artifacts/v7-10x-feed-loc/generated-harvest-manifest.v1.json
        run: node scripts/compose-mark-real-corpus-challenge.mjs
      - name: Harvest 10x physical custody with audited exclusions
        env:
          MARK_HARVEST_MANIFEST: artifacts/mark-real-corpus-challenge-v1/generated-challenge-harvest-manifest.v1.json
          MARK_CONTINUITY_KEY: mark-v7-10x-${{ github.run_id }}-${{ github.sha }}
          MARK_NEAR_DUPLICATE_BITS: 2
          MARK_HARVEST_MIN_PER_LANE: 216
        run: node scripts/harvest-mark-sources.mjs
      - name: Propose blind multiscale observations
        env:
          MARK_MAX_COMPONENTS_PER_SOURCE: 32
        run: node scripts/propose-mark-observables.mjs
      - name: Verify sealed 10x blind input
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          const p="artifacts/mark-conveyor-input-v1/mark-observable-input-blind-v1.json";
          const value=JSON.parse(fs.readFileSync(p,"utf8"));
          const {blindInputSha256,...core}=value;
          const computed=crypto.createHash("sha256").update(JSON.stringify(core)).digest("hex");
          if(!blindInputSha256 || blindInputSha256!==computed) throw new Error("10x blind input SHA-256 verification failed");
          const lanes=Object.fromEntries(["train","holdout","control"].map(lane=>[lane,value.sources.filter(source=>source.lane===lane).length]));
          const min=Number(process.env.MARK_V7_MIN_LANE_SOURCES);
          for(const [lane,count] of Object.entries(lanes)) if(count<min) throw new Error(`10x retained lane below gate: ${lane}=${count}<${min}`);
          if(value.observations.length<Number(process.env.MARK_V7_MIN_OBSERVATIONS)) throw new Error(`10x observation gate failed: ${value.observations.length}`);
          console.log(`sealed 10x input ${blindInputSha256}; lanes=${JSON.stringify(lanes)} observations=${value.observations.length}`);
          NODE
      - name: Build compacted sparse compiler
        run: cargo build --release --manifest-path crates/mark-sparse-compiler/Cargo.toml
      - name: Compile 10x relational world under hard 512 MB ceiling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MARK_V7_OUT"
          (
            ulimit -v "$MARK_V7_MAX_RSS_KB"
            /usr/bin/time -v crates/mark-sparse-compiler/target/release/mark-sparse-compiler compile \
              --input artifacts/mark-conveyor-input-v1/mark-observable-input-blind-v1.json \
              --out "$MARK_V7_OUT" \
              --tile 512 \
              --overlap 32 \
              --null-iterations 16 \
              --min-sources 3
          ) 2> >(tee "$MARK_V7_OUT/runtime.txt" >&2)
      - name: Assert 10x sparse architecture gate
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const out=process.env.MARK_V7_OUT;
          const summary=JSON.parse(fs.readFileSync(`${out}/summary.json`,"utf8"));
          const custody=JSON.parse(fs.readFileSync(`${out}/custody.json`,"utf8"));
          const evaluation=JSON.parse(fs.readFileSync(`${out}/evaluation.json`,"utf8"));
          const blind=JSON.parse(fs.readFileSync("artifacts/mark-conveyor-input-v1/mark-observable-input-blind-v1.json","utf8"));
          const runtime=fs.readFileSync(`${out}/runtime.txt`,"utf8");
          const lanes=Object.fromEntries(["train","holdout","control"].map(lane=>[lane,blind.sources.filter(source=>source.lane===lane).length]));
          const rss=Number(runtime.match(/Maximum resident set size \(kbytes\):\s*(\d+)/)?.[1] ?? NaN);
          const fsOutputs=Number(runtime.match(/File system outputs:\s*(\d+)/)?.[1] ?? NaN);
          const wall=runtime.match(/Elapsed \(wall clock\) time \(h:mm:ss or m:ss\):\s*([^\n]+)/)?.[1]?.trim() ?? null;
          const outputKb=Number(execFileSync("du",["-sk",out],{encoding:"utf8"}).trim().split(/\s+/)[0]);
          if(summary.sources!==blind.sources.length || summary.observations!==blind.observations.length) throw new Error("10x compiler input/output count mismatch");
          if(summary.sources<Number(process.env.MARK_V7_MIN_LANE_SOURCES)*3) throw new Error(`10x source gate failed: ${summary.sources}`);
          if(summary.observations<Number(process.env.MARK_V7_MIN_OBSERVATIONS)) throw new Error(`10x observation gate failed: ${summary.observations}`);
          if(!Number.isFinite(rss)||rss>Number(process.env.MARK_V7_MAX_RSS_KB)) throw new Error(`10x memory gate failed: ${rss}`);
          if(!custody.contract?.appendOnlyEventLedger || custody.contract?.wholeWorldGraphMaterialized || custody.contract?.wholeWorldJsonMaterialized || custody.contract?.grammarPairsMaterialized) throw new Error("10x sparse custody contract violated");
          if(BigInt(summary.observedPairWeight)<1n || summary.grammarRows<1 || summary.events<1 || summary.centers<1) throw new Error("10x compiler emitted no relational evidence");
          const assertion={schema:"mark_v7_10x_scale_assertion_v1",status:"passed",scaleGateOnly:true,scientificInterpretationAuthorized:false,sourceBlindInputSha256:summary.sourceBlindInputSha256,lanes,sources:summary.sources,observations:summary.observations,tiles:summary.tiles,centers:summary.centers,events:summary.events,grammarRows:summary.grammarRows,observedPairWeight:summary.observedPairWeight,rules:evaluation.rules,maxRssKb:rss,memoryGateKb:Number(process.env.MARK_V7_MAX_RSS_KB),wallTime:wall,fileSystemOutputs:fsOutputs,outputDirectoryKb:outputKb,ledgerMerkleRoot:custody.merkleRoot};
          fs.writeFileSync(`${out}/scale-assertion.json`,`${JSON.stringify(assertion,null,2)}\n`);
          console.log(JSON.stringify(assertion,null,2));
          NODE
      - name: Free bulky world rows after custody metrics
        run: rm -rf "$MARK_V7_OUT/events.jsonl" "$MARK_V7_OUT/grammar-shards"
      - name: Publish 10x architecture summary
        run: |
          echo '### Mark v7 10x scale gate' >> "$GITHUB_STEP_SUMMARY"
          cat "$MARK_V7_OUT/scale-assertion.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload 10x sufficient evidence
        uses: actions/upload-artifact@v4
        with:
          name: mark-v7-10x-scale-evidence
          path: |
            artifacts/mark-v7-10x/summary.json
            artifacts/mark-v7-10x/custody.json
            artifacts/mark-v7-10x/evaluation.json
            artifacts/mark-v7-10x/rules.jsonl
            artifacts/mark-v7-10x/runtime.txt
            artifacts/mark-v7-10x/scale-assertion.json
          if-no-files-found: error
          retention-days: 30
