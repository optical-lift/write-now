name: Mark v7 10x Scale Gate

on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ten-x-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MARK_V7_OUT: artifacts/mark-v7-10x
      MARK_V7_MAX_RSS_KB: 524288
      MARK_V7_MIN_LANE_SOURCES: 216
      MARK_V7_MIN_OBSERVATIONS: 20000
      MARK_V7_COMPILER_INPUT: artifacts/mark-conveyor-input-v1/mark-observable-input-blind-v1.compiler.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install acquisition dependencies
        run: npm install
      - name: Validate scale-gate source
        run: |
          rustc --version
          cargo --version
          cargo check --manifest-path crates/mark-sparse-compiler/Cargo.toml
      - name: Expand 10x heterogeneous feeds
        run: |
          MARK_OPEN_ACCESS_FEED_REQUEST=research/mark/harvest-feeds/cleveland-firehose-train-10x.v1.json MARK_OPEN_ACCESS_FEED_OUT=artifacts/v7-10x-feed-cleveland node scripts/expand-mark-open-access-feed.mjs
          MARK_IIIF_FEED_REQUEST=research/mark/harvest-feeds/bsb-iiif-holdout-10x.v1.json MARK_IIIF_FEED_OUT=artifacts/v7-10x-feed-bsb node scripts/expand-mark-iiif-feed.mjs
          MARK_OPEN_ACCESS_FEED_REQUEST=research/mark/harvest-feeds/loc-photos-control-10x.v1.json MARK_OPEN_ACCESS_FEED_OUT=artifacts/v7-10x-feed-loc node scripts/expand-mark-open-access-feed.mjs
      - name: Compose sealed 10x transfer packet
        env:
          MARK_CHALLENGE_ID: mark:v7:heterogeneous-sparse-10x-v1
          MARK_CHALLENGE_MANIFESTS: artifacts/v7-10x-feed-cleveland/generated-harvest-manifest.v1.json,artifacts/v7-10x-feed-bsb/generated-harvest-manifest.v1.json,artifacts/v7-10x-feed-loc/generated-harvest-manifest.v1.json
        run: node scripts/compose-mark-real-corpus-challenge.mjs
      - name: Harvest 10x physical custody with audited exclusions
        env:
          MARK_HARVEST_MANIFEST: artifacts/mark-real-corpus-challenge-v1/generated-challenge-harvest-manifest.v1.json
          MARK_CONTINUITY_KEY: mark-v7-10x-${{ github.run_id }}-${{ github.sha }}
          MARK_NEAR_DUPLICATE_BITS: 2
          MARK_HARVEST_MIN_PER_LANE: 216
        run: node scripts/harvest-mark-sources.mjs
      - name: Propose blind multiscale observations
        env:
          MARK_MAX_COMPONENTS_PER_SOURCE: 32
        run: node scripts/propose-mark-observables.mjs
      - name: Normalize vector captures for the Rust compiler without changing physical custody
        run: |
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import sharp from "sharp";

          const sourcePath="artifacts/mark-conveyor-input-v1/mark-observable-input-blind-v1.json";
          const outputPath=process.env.MARK_V7_COMPILER_INPUT;
          const source=JSON.parse(fs.readFileSync(sourcePath,"utf8"));
          const {blindInputSha256:parentBlindInputSha256,...sourceCore}=source;
          const computedParent=crypto.createHash("sha256").update(JSON.stringify(sourceCore)).digest("hex");
          if(!parentBlindInputSha256||parentBlindInputSha256!==computedParent) throw new Error("proposal blind input SHA-256 verification failed before compiler normalization");

          const sourceDir=path.dirname(sourcePath);
          const outputDir=path.dirname(outputPath);
          if(path.resolve(sourceDir)!==path.resolve(outputDir)) throw new Error("compiler-normalized blind input must remain beside the sealed proposal input");
          const rasterDir=path.join(outputDir,"compiler-captures");
          fs.mkdirSync(rasterDir,{recursive:true});

          const wholeBySource=new Map(source.observations.filter(o=>o.proposalKind==="whole_capture").map(o=>[o.sourceGroupId,o]));
          const mappings=[];
          const normalizedSources=[];
          for(const item of source.sources){
            let capturePath=item.capturePath;
            if(path.extname(capturePath).toLowerCase()===".svg"){
              const absolute=path.resolve(sourceDir,capturePath);
              const physicalBytes=fs.readFileSync(absolute);
              const {data,info}=await sharp(physicalBytes).greyscale().raw().toBuffer({resolveWithObject:true});
              const whole=wholeBySource.get(item.sourceGroupId);
              if(!whole||whole.region.x!==0||whole.region.y!==0||whole.region.width!==info.width||whole.region.height!==info.height){
                throw new Error(`SVG raster geometry no longer matches sealed proposal for ${item.sourceGroupId}: proposal=${JSON.stringify(whole?.region)} raster=${info.width}x${info.height}`);
              }
              const compilerBytes=await sharp(data,{raw:{width:info.width,height:info.height,channels:info.channels}}).png({compressionLevel:9}).toBuffer();
              const outputName=`${item.sourceGroupId}.png`;
              const output=path.join(rasterDir,outputName);
              fs.writeFileSync(output,compilerBytes);
              capturePath=path.posix.join("compiler-captures",outputName);
              mappings.push({
                sourceGroupId:item.sourceGroupId,
                physicalCapturePath:item.capturePath,
                compilerCapturePath:capturePath,
                width:info.width,
                height:info.height,
                physicalCaptureSha256:crypto.createHash("sha256").update(physicalBytes).digest("hex"),
                compilerCaptureSha256:crypto.createHash("sha256").update(compilerBytes).digest("hex")
              });
            }
            normalizedSources.push({...item,capturePath});
          }

          const compilerCore={...sourceCore,sources:normalizedSources};
          const compilerBlindInputSha256=crypto.createHash("sha256").update(JSON.stringify(compilerCore)).digest("hex");
          fs.writeFileSync(outputPath,`${JSON.stringify({...compilerCore,blindInputSha256:compilerBlindInputSha256},null,2)}\n`);
          const custody={
            schema:"mark_v7_compiler_capture_normalization_custody_v1",
            parentProposalBlindInputSha256:parentBlindInputSha256,
            compilerBlindInputSha256,
            vectorPolicy:"svg rendered by the same sharp grayscale raster path used by blind proposal; sealed whole-capture geometry must match exactly",
            originalCapturesRetained:true,
            normalizedVectorCaptures:mappings.length,
            mappings
          };
          fs.writeFileSync(path.join(outputDir,"compiler-normalization-custody.json"),`${JSON.stringify(custody,null,2)}\n`);
          console.log(`compiler input ${compilerBlindInputSha256}; normalized ${mappings.length} SVG captures; parent proposal ${parentBlindInputSha256}`);
          NODE
      - name: Verify sealed 10x compiler input
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          const p=process.env.MARK_V7_COMPILER_INPUT;
          const value=JSON.parse(fs.readFileSync(p,"utf8"));
          const {blindInputSha256,...core}=value;
          const computed=crypto.createHash("sha256").update(JSON.stringify(core)).digest("hex");
          if(!blindInputSha256 || blindInputSha256!==computed) throw new Error("10x compiler input SHA-256 verification failed");
          const normalization=JSON.parse(fs.readFileSync("artifacts/mark-conveyor-input-v1/compiler-normalization-custody.json","utf8"));
          if(normalization.compilerBlindInputSha256!==blindInputSha256) throw new Error("compiler normalization custody does not match sealed compiler input");
          const lanes=Object.fromEntries(["train","holdout","control"].map(lane=>[lane,value.sources.filter(source=>source.lane===lane).length]));
          const min=Number(process.env.MARK_V7_MIN_LANE_SOURCES);
          for(const [lane,count] of Object.entries(lanes)) if(count<min) throw new Error(`10x retained lane below gate: ${lane}=${count}<${min}`);
          if(value.observations.length<Number(process.env.MARK_V7_MIN_OBSERVATIONS)) throw new Error(`10x observation gate failed: ${value.observations.length}`);
          console.log(`sealed 10x compiler input ${blindInputSha256}; parent=${normalization.parentProposalBlindInputSha256}; normalized_vectors=${normalization.normalizedVectorCaptures}; lanes=${JSON.stringify(lanes)} observations=${value.observations.length}`);
          NODE
      - name: Build rowless sparse compiler
        run: cargo build --release --manifest-path crates/mark-sparse-compiler/Cargo.toml
      - name: Compile 10x relational world under hard 512 MB ceiling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MARK_V7_OUT"
          (
            ulimit -v "$MARK_V7_MAX_RSS_KB"
            /usr/bin/time -v crates/mark-sparse-compiler/target/release/mark-sparse-compiler compile \
              --input "$MARK_V7_COMPILER_INPUT" \
              --out "$MARK_V7_OUT" \
              --tile 512 \
              --overlap 32 \
              --null-iterations 16 \
              --min-sources 3
          ) 2> >(tee "$MARK_V7_OUT/runtime.txt" >&2)
      - name: Assert 10x rowless architecture gate
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          import { execFileSync } from "node:child_process";
          const out=process.env.MARK_V7_OUT;
          const summary=JSON.parse(fs.readFileSync(`${out}/summary.json`,"utf8"));
          const custody=JSON.parse(fs.readFileSync(`${out}/custody.json`,"utf8"));
          const evaluation=JSON.parse(fs.readFileSync(`${out}/evaluation.json`,"utf8"));
          const blind=JSON.parse(fs.readFileSync(process.env.MARK_V7_COMPILER_INPUT,"utf8"));
          const normalization=JSON.parse(fs.readFileSync("artifacts/mark-conveyor-input-v1/compiler-normalization-custody.json","utf8"));
          const runtime=fs.readFileSync(`${out}/runtime.txt`,"utf8");
          const lanes=Object.fromEntries(["train","holdout","control"].map(lane=>[lane,blind.sources.filter(source=>source.lane===lane).length]));
          const rss=Number(runtime.match(/Maximum resident set size \(kbytes\):\s*(\d+)/)?.[1] ?? NaN);
          const fsOutputs=Number(runtime.match(/File system outputs:\s*(\d+)/)?.[1] ?? NaN);
          const wall=runtime.match(/Elapsed \(wall clock\) time \(h:mm:ss or m:ss\):\s*([^\n]+)/)?.[1]?.trim() ?? null;
          const outputKb=Number(execFileSync("du",["-sk",out],{encoding:"utf8"}).trim().split(/\s+/)[0]);
          if(summary.schema!=="mark_sparse_compiler_summary_v2" || custody.schema!=="mark_sparse_ledger_custody_v2") throw new Error("10x rowless schema mismatch");
          if(summary.sources!==blind.sources.length || summary.observations!==blind.observations.length) throw new Error("10x compiler input/output count mismatch");
          if(summary.sources<Number(process.env.MARK_V7_MIN_LANE_SOURCES)*3) throw new Error(`10x source gate failed: ${summary.sources}`);
          if(summary.observations<Number(process.env.MARK_V7_MIN_OBSERVATIONS)) throw new Error(`10x observation gate failed: ${summary.observations}`);
          if(!Number.isFinite(rss)||rss>Number(process.env.MARK_V7_MAX_RSS_KB)) throw new Error(`10x memory gate failed: ${rss}`);
          const contract=custody.contract ?? {};
          if(!contract.appendOnlyPhysicalEventLedger || contract.wholeWorldGraphMaterialized || contract.wholeWorldJsonMaterialized || contract.grammarPairsMaterialized || contract.grammarRowsMaterialized) throw new Error("10x sparse custody contract violated");
          if(!contract.grammarSufficientStatisticsDiskBacked || !contract.distinctSourceSupportCommittedAtSourceBoundary || !contract.perObservationContributionHashes) throw new Error("10x sufficient-statistics contract incomplete");
          if(summary.grammarRowsMaterialized!==0) throw new Error(`10x materialized ${summary.grammarRowsMaterialized} grammar rows`);
          if(summary.grammarStatRows<1 || summary.contextStatRows<1 || summary.sourceStatCommits<1) throw new Error("10x sufficient-statistics store is empty");
          if(summary.grammarContributions!==summary.observations*(summary.nullIterations+1)) throw new Error("10x contribution ledger is incomplete");
          if(BigInt(summary.observedPairWeight)<1n || summary.events<1 || summary.centers<1) throw new Error("10x compiler emitted no relational evidence");
          if(summary.physicalLedgerMerkleRoot!==custody.physicalLedger?.merkleRoot || summary.grammarContributionMerkleRoot!==custody.grammarStatistics?.contributionMerkleRoot) throw new Error("10x custody roots disagree with summary");
          if(normalization.compilerBlindInputSha256!==summary.sourceBlindInputSha256 || !normalization.parentProposalBlindInputSha256) throw new Error("10x compiler normalization custody chain is incomplete");
          const db=fs.readFileSync(`${out}/grammar-stats.sqlite`);
          const dbSha=crypto.createHash("sha256").update(db).digest("hex");
          if(dbSha!==custody.grammarStatistics?.databaseSha256) throw new Error("10x sufficient-statistics database hash mismatch");
          const assertion={schema:"mark_v7_10x_scale_assertion_v3",status:"passed",scaleGateOnly:true,scientificInterpretationAuthorized:false,parentProposalBlindInputSha256:normalization.parentProposalBlindInputSha256,sourceBlindInputSha256:summary.sourceBlindInputSha256,normalizedVectorCaptures:normalization.normalizedVectorCaptures,lanes,sources:summary.sources,observations:summary.observations,tiles:summary.tiles,centers:summary.centers,events:summary.events,grammarRowsMaterialized:summary.grammarRowsMaterialized,grammarStatRows:summary.grammarStatRows,contextStatRows:summary.contextStatRows,sourceStatCommits:summary.sourceStatCommits,grammarContributions:summary.grammarContributions,observedPairWeight:summary.observedPairWeight,rules:evaluation.rules,maxRssKb:rss,memoryGateKb:Number(process.env.MARK_V7_MAX_RSS_KB),wallTime:wall,fileSystemOutputs:fsOutputs,outputDirectoryKb:outputKb,physicalLedgerMerkleRoot:custody.physicalLedger.merkleRoot,grammarContributionMerkleRoot:custody.grammarStatistics.contributionMerkleRoot,grammarStatisticsDatabaseSha256:dbSha,grammarStatisticsDatabaseBytes:custody.grammarStatistics.databaseBytes};
          fs.writeFileSync(`${out}/scale-assertion.json`,`${JSON.stringify(assertion,null,2)}\n`);
          console.log(JSON.stringify(assertion,null,2));
          NODE
      - name: Free bulky ledgers after custody metrics
        run: rm -f "$MARK_V7_OUT/events.jsonl" "$MARK_V7_OUT/grammar-contributions.jsonl"
      - name: Publish 10x architecture summary
        run: |
          echo '### Mark v7 10x scale gate' >> "$GITHUB_STEP_SUMMARY"
          cat "$MARK_V7_OUT/scale-assertion.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload 10x sufficient evidence
        uses: actions/upload-artifact@v4
        with:
          name: mark-v7-10x-scale-evidence
          path: |
            artifacts/mark-v7-10x/summary.json
            artifacts/mark-v7-10x/custody.json
            artifacts/mark-v7-10x/evaluation.json
            artifacts/mark-v7-10x/rules.jsonl
            artifacts/mark-v7-10x/grammar-stats.sqlite
            artifacts/mark-v7-10x/runtime.txt
            artifacts/mark-v7-10x/scale-assertion.json
            artifacts/mark-conveyor-input-v1/compiler-normalization-custody.json
          if-no-files-found: error
          retention-days: 30
