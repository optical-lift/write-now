name: Mark Masked Slot Substitution v1

on:
  pull_request:
    paths:
      - "crates/mark-sparse-compiler/src/bin/mark-observation-topology-atlas.rs"
      - "scripts/discover-mark-masked-slot-vocabulary.py"
      - "scripts/evaluate-mark-masked-slot-substitution.py"
      - "scripts/rejoin-mark-masked-slot-substitution.py"
      - "research/mark/discovery-experiments/masked-slot-substitution-v1.protocol.json"
      - ".github/workflows/mark-masked-slot-substitution-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  MARK_PARENT_ATLAS_RUN_ID: 33755743472
  MARK_MASKED_SLOT_PROTOCOL: research/mark/discovery-experiments/masked-slot-substitution-v1.protocol.json
  MARK_V7_MAX_RSS_KB: 524288

jobs:
  blind-masked-slot-substitution:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate masked-slot protocol and analysis
        run: |
          python3 -m json.tool "$MARK_MASKED_SLOT_PROTOCOL" >/dev/null
          python3 -m py_compile \
            scripts/discover-mark-masked-slot-vocabulary.py \
            scripts/evaluate-mark-masked-slot-substitution.py \
            scripts/rejoin-mark-masked-slot-substitution.py

      - name: Download exact sealed compiler evidence
        uses: actions/download-artifact@v4
        with:
          name: mark-source-rule-atlas-v1-sealed-evidence
          path: artifact-staging/blind-evidence
          repository: optical-lift/write-now
          run-id: ${{ env.MARK_PARENT_ATLAS_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download frozen parent custody
        uses: actions/download-artifact@v4
        with:
          name: mark-source-rule-atlas-v1-frozen
          path: artifact-staging/parent-atlas
          repository: optical-lift/write-now
          run-id: ${{ env.MARK_PARENT_ATLAS_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Test and build frozen v7 plus topology projector
        run: |
          cargo test --manifest-path crates/mark-sparse-compiler/Cargo.toml --bin mark-observation-topology-atlas
          cargo build --release --manifest-path crates/mark-sparse-compiler/Cargo.toml --bins

      - name: Reproduce exact frozen physical world under 512 MB
        shell: bash
        env:
          MARK_V7_COMPILER_INPUT: artifact-staging/blind-evidence/mark-conveyor-input-v1/mark-observable-input-blind-v1.compiler.json
          MARK_V7_OUT: artifacts/mark-masked-slot-compiler-v1
        run: |
          set -euo pipefail
          mkdir -p "$MARK_V7_OUT"
          (
            ulimit -v "$MARK_V7_MAX_RSS_KB"
            /usr/bin/time -v crates/mark-sparse-compiler/target/release/mark-sparse-compiler compile \
              --input "$MARK_V7_COMPILER_INPUT" \
              --out "$MARK_V7_OUT" \
              --tile 512 --overlap 32 --null-iterations 16 --min-sources 3
          ) 2> >(tee "$MARK_V7_OUT/runtime.txt" >&2)

      - name: Project anonymous raw topology for every observation
        shell: bash
        run: |
          set -euo pipefail
          expected_merkle="$(python3 - <<'PY'
          import json
          print(json.load(open('artifact-staging/parent-atlas/compiler/custody.json'))['physicalLedger']['merkleRoot'])
          PY
          )"
          mkdir -p artifacts/mark-observation-topology-atlas-v1
          (
            ulimit -v "$MARK_V7_MAX_RSS_KB"
            /usr/bin/time -v crates/mark-sparse-compiler/target/release/mark-observation-topology-atlas \
              --events artifacts/mark-masked-slot-compiler-v1/events.jsonl \
              --custody artifacts/mark-masked-slot-compiler-v1/custody.json \
              --input artifact-staging/blind-evidence/mark-conveyor-input-v1/mark-observable-input-blind-v1.compiler.json \
              --expected-merkle "$expected_merkle" \
              --out artifacts/mark-observation-topology-atlas-v1
          ) 2> >(tee artifacts/mark-observation-topology-atlas-v1/runtime.txt >&2)

      - name: Freeze masked slot and occupant vocabularies independently
        env:
          MARK_TOPOLOGY_ATLAS: artifacts/mark-observation-topology-atlas-v1
          MARK_PARENT_ATLAS: artifact-staging/parent-atlas
          MARK_MASKED_SLOT_VOCAB_OUT: artifacts/mark-masked-slot-vocabulary-v1
        run: python3 scripts/discover-mark-masked-slot-vocabulary.py

      - name: Join frozen vocabularies and ask which physical occupants substitute
        env:
          MARK_MASKED_SLOT_VOCAB: artifacts/mark-masked-slot-vocabulary-v1
          MARK_MASKED_SLOT_OUT: artifacts/mark-masked-slot-substitution-v1
        run: python3 scripts/evaluate-mark-masked-slot-substitution.py

      - name: Free bulky physical ledgers after substitution freeze
        run: rm -f artifacts/mark-masked-slot-compiler-v1/events.jsonl artifacts/mark-masked-slot-compiler-v1/grammar-contributions.jsonl

      - name: Stage frozen blind substitution packet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            artifact-staging/masked-slot/vocabulary \
            artifact-staging/masked-slot/substitution \
            artifact-staging/masked-slot/topology-atlas \
            artifact-staging/masked-slot/compiler-custody
          cp -a artifacts/mark-masked-slot-vocabulary-v1/. artifact-staging/masked-slot/vocabulary/
          cp -a artifacts/mark-masked-slot-substitution-v1/. artifact-staging/masked-slot/substitution/
          cp -a artifacts/mark-observation-topology-atlas-v1/. artifact-staging/masked-slot/topology-atlas/
          cp artifacts/mark-masked-slot-compiler-v1/custody.json artifact-staging/masked-slot/compiler-custody/

      - name: Publish blind substitution summary
        shell: bash
        run: |
          echo '### Mark masked-slot substitution v1 — provenance still sealed' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/mark-masked-slot-substitution-v1/summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frozen blind substitution packet
        uses: actions/upload-artifact@v4
        with:
          name: mark-masked-slot-substitution-v1-frozen
          path: artifact-staging/masked-slot/**
          if-no-files-found: error
          retention-days: 30

  context-rejoin:
    needs: blind-masked-slot-substitution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen substitution packet first
        uses: actions/download-artifact@v4
        with:
          name: mark-masked-slot-substitution-v1-frozen
          path: artifact-staging/masked-slot

      - name: Download source provenance only after substitution SHA exists
        uses: actions/download-artifact@v4
        with:
          name: mark-source-rule-atlas-v1-context-rejoin
          path: artifact-staging/context
          repository: optical-lift/write-now
          run-id: ${{ env.MARK_PARENT_ATLAS_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Rejoin provenance without changing vocabulary or substitution statistics
        env:
          MARK_MASKED_SLOT_PACKET: artifact-staging/masked-slot
          MARK_SOURCE_CONTEXT: artifact-staging/context
          MARK_MASKED_SLOT_REJOIN_OUT: artifacts/mark-masked-slot-substitution-v1-context
        run: python3 scripts/rejoin-mark-masked-slot-substitution.py

      - name: Publish contextualized substitution summary
        shell: bash
        run: |
          echo '### Mark masked-slot substitution v1 — provenance rejoined after freeze' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/mark-masked-slot-substitution-v1-context/summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload contextual substitution rejoin
        uses: actions/upload-artifact@v4
        with:
          name: mark-masked-slot-substitution-v1-context-rejoin
          path: artifacts/mark-masked-slot-substitution-v1-context/**
          if-no-files-found: error
          retention-days: 30
