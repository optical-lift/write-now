name: Mark Operator Proximal Perturbation v30

on:
  pull_request:
    paths:
      - "scripts/mark_operator_proximal_perturbation_v30_core.py"
      - "scripts/prepare-mark-operator-proximal-perturbation-v30.py"
      - "scripts/freeze-mark-operator-proximal-perturbation-v30.py"
      - "scripts/evaluate-mark-operator-proximal-perturbation-v30.py"
      - "research/mark/discovery-experiments/operator-proximal-perturbation-v30.protocol.json"
      - ".github/workflows/mark-operator-proximal-perturbation-v30.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

env:
  MARK_V30_PROTOCOL: research/mark/discovery-experiments/operator-proximal-perturbation-v30.protocol.json
  OSHB_COMMIT: 3d15126fb1ef74867fc1434be1942e837932691f
  OSHB_TREE: 50e6be1d06a80cef7d9285b3c8e4dff47e420bf6
  OSHB_EXOD_BLOB: 9397e001f25d14353793a3924d4e9c605cecfc6c

jobs:
  custody:
    name: Build fresh whole-book Hebrew perturbation packets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate V30 protocol and code before source acquisition
        run: |
          python3 -m json.tool "$MARK_V30_PROTOCOL" >/dev/null
          python3 -m py_compile \
            scripts/mark_operator_proximal_perturbation_v30_core.py \
            scripts/prepare-mark-operator-proximal-perturbation-v30.py \
            scripts/freeze-mark-operator-proximal-perturbation-v30.py \
            scripts/evaluate-mark-operator-proximal-perturbation-v30.py
      - name: Acquire exact Open Scriptures Hebrew Bible commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-staging/morphhb
          git -C artifact-staging/morphhb init -q
          git -C artifact-staging/morphhb remote add origin https://github.com/openscriptures/morphhb.git
          git -C artifact-staging/morphhb fetch -q --depth=1 origin "$OSHB_COMMIT"
          git -C artifact-staging/morphhb checkout -q --detach FETCH_HEAD
          test "$(git -C artifact-staging/morphhb rev-parse HEAD)" = "$OSHB_COMMIT"
          test "$(git -C artifact-staging/morphhb rev-parse HEAD^{tree})" = "$OSHB_TREE"
          test "$(git -C artifact-staging/morphhb hash-object wlc/Exod.xml)" = "$OSHB_EXOD_BLOB"
      - name: Parse whole books with frozen fresh V30 custody split
        env:
          PYTHONPATH: scripts
          MARK_V30_WLC: artifact-staging/morphhb/wlc
          MARK_V30_OUT: artifact-staging/all
        run: python3 scripts/prepare-mark-operator-proximal-perturbation-v30.py
      - name: Physically separate TRAIN books and sealed evaluation books
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-staging/hebrew-train artifact-staging/hebrew-eval
          cp artifact-staging/all/train.jsonl artifact-staging/hebrew-train/train.jsonl
          cp artifact-staging/all/manifest.json artifact-staging/hebrew-train/manifest.json
          cp artifact-staging/all/holdout.jsonl artifact-staging/hebrew-eval/holdout.jsonl
          cp artifact-staging/all/control.jsonl artifact-staging/hebrew-eval/control.jsonl
          cp artifact-staging/all/manifest.json artifact-staging/hebrew-eval/manifest.json
          rm -rf artifact-staging/all artifact-staging/morphhb
          test ! -e artifact-staging/hebrew-train/holdout.jsonl
          test ! -e artifact-staging/hebrew-train/control.jsonl
          test ! -e artifact-staging/hebrew-eval/train.jsonl
          test ! -d artifact-staging/morphhb
      - uses: actions/upload-artifact@v4
        with:
          name: mark-operator-proximal-perturbation-v30-hebrew-train
          path: artifact-staging/hebrew-train/**
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: mark-operator-proximal-perturbation-v30-hebrew-sealed-evaluation
          path: artifact-staging/hebrew-eval/**
          if-no-files-found: error
          retention-days: 30

  freeze:
    name: Freeze matched V29-compatible perturbations
    needs: custody
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mark-operator-proximal-perturbation-v30-hebrew-train
          path: artifact-staging/hebrew-train
      - name: Prove evaluation lanes are absent
        run: |
          test -z "$(find artifact-staging -type f \( -name 'holdout.jsonl' -o -name 'control.jsonl' \) -print -quit)"
          echo "evaluation_visible_to_freeze=false"
      - name: Freeze V30 operator model and matched substitutions
        env:
          PYTHONPATH: scripts
          MARK_V30_HEBREW_TRAIN: artifact-staging/hebrew-train
          MARK_V30_FREEZE_OUT: artifacts/mark-operator-proximal-perturbation-v30/freeze
        run: python3 scripts/freeze-mark-operator-proximal-perturbation-v30.py
      - name: Publish pre-evaluation freeze summary
        run: cat artifacts/mark-operator-proximal-perturbation-v30/freeze/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mark-operator-proximal-perturbation-v30-freeze
          path: artifacts/mark-operator-proximal-perturbation-v30/freeze/**
          if-no-files-found: error
          retention-days: 30

  evaluate:
    name: Evaluate proximal structural damage on sealed lanes
    needs: [custody, freeze]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable V30 freeze first
        uses: actions/download-artifact@v4
        with:
          name: mark-operator-proximal-perturbation-v30-freeze
          path: artifact-staging/freeze
      - name: Open sealed Hebrew books only after freeze
        uses: actions/download-artifact@v4
        with:
          name: mark-operator-proximal-perturbation-v30-hebrew-sealed-evaluation
          path: artifact-staging/hebrew-eval
      - name: Prove training data are absent
        run: |
          test ! -e artifact-staging/hebrew-eval/train.jsonl
          test ! -d artifact-staging/hebrew-train
          test ! -d artifact-staging/morphhb
          echo "training_visible_to_evaluation=false"
      - name: Evaluate frozen V30 perturbation
        env:
          PYTHONPATH: scripts
          MARK_V30_FREEZE: artifact-staging/freeze
          MARK_V30_HEBREW_EVAL: artifact-staging/hebrew-eval
          MARK_V30_RESULT_OUT: artifacts/mark-operator-proximal-perturbation-v30/result
        run: python3 scripts/evaluate-mark-operator-proximal-perturbation-v30.py
      - name: Publish result summary
        run: cat artifacts/mark-operator-proximal-perturbation-v30/result/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish frozen result on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file artifacts/mark-operator-proximal-perturbation-v30/result/summary.md --edit-last --create-if-none
      - uses: actions/upload-artifact@v4
        with:
          name: mark-operator-proximal-perturbation-v30-frozen
          path: artifacts/mark-operator-proximal-perturbation-v30/**
          if-no-files-found: error
          retention-days: 30
