name: Mark v7 Live Sufficient Statistics Equivalence Gate

on:
  pull_request:
    paths:
      - "crates/mark-sparse-compiler/**"
      - "scripts/harvest-mark-sources.mjs"
      - "scripts/propose-mark-observables.mjs"
      - "scripts/normalize-mark-v7-compiler-input.mjs"
      - "scripts/expand-mark-open-access-feed.mjs"
      - "scripts/expand-mark-iiif-feed.mjs"
      - "scripts/compose-mark-real-corpus-challenge.mjs"
      - "research/mark/harvest-feeds/cleveland-firehose-train.v1.json"
      - "research/mark/harvest-feeds/bsb-iiif-holdout.v1.json"
      - "research/mark/harvest-feeds/loc-photos-control.v1.json"
      - ".github/workflows/mark-v7-live-equivalence-gate.yml"

permissions:
  contents: read

jobs:
  live-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MARK_V7_MAX_RSS_KB: 524288
      MARK_BASELINE_COMMIT: 876a287b76d37833e55ee75d9693e9bf8be30bb8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install acquisition dependencies
        run: npm install
      - name: Expand exact live 1x heterogeneous feeds
        run: |
          MARK_OPEN_ACCESS_FEED_REQUEST=research/mark/harvest-feeds/cleveland-firehose-train.v1.json MARK_OPEN_ACCESS_FEED_OUT=artifacts/v7-eq-feed-cleveland node scripts/expand-mark-open-access-feed.mjs
          MARK_IIIF_FEED_REQUEST=research/mark/harvest-feeds/bsb-iiif-holdout.v1.json MARK_IIIF_FEED_OUT=artifacts/v7-eq-feed-bsb node scripts/expand-mark-iiif-feed.mjs
          MARK_OPEN_ACCESS_FEED_REQUEST=research/mark/harvest-feeds/loc-photos-control.v1.json MARK_OPEN_ACCESS_FEED_OUT=artifacts/v7-eq-feed-loc node scripts/expand-mark-open-access-feed.mjs
      - name: Compose one sealed live packet
        env:
          MARK_CHALLENGE_ID: mark:v7:live-sufficient-statistics-equivalence-v1
          MARK_CHALLENGE_MANIFESTS: artifacts/v7-eq-feed-cleveland/generated-harvest-manifest.v1.json,artifacts/v7-eq-feed-bsb/generated-harvest-manifest.v1.json,artifacts/v7-eq-feed-loc/generated-harvest-manifest.v1.json
        run: node scripts/compose-mark-real-corpus-challenge.mjs
      - name: Harvest physical custody once
        env:
          MARK_HARVEST_MANIFEST: artifacts/mark-real-corpus-challenge-v1/generated-challenge-harvest-manifest.v1.json
          MARK_CONTINUITY_KEY: mark-v7-equivalence-${{ github.run_id }}-${{ github.sha }}
          MARK_NEAR_DUPLICATE_BITS: 2
          MARK_HARVEST_MIN_PER_LANE: 12
        run: node scripts/harvest-mark-sources.mjs
      - name: Propose one blind observable packet
        env:
          MARK_MAX_COMPONENTS_PER_SOURCE: 32
        run: node scripts/propose-mark-observables.mjs
      - name: Seal and fingerprint shared compiler input
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          const p="artifacts/mark-conveyor-input-v1/mark-observable-input-blind-v1.json";
          const value=JSON.parse(fs.readFileSync(p,"utf8"));
          const {blindInputSha256,...core}=value;
          const computed=crypto.createHash("sha256").update(JSON.stringify(core)).digest("hex");
          if(!blindInputSha256 || blindInputSha256!==computed) throw new Error("shared blind input SHA-256 verification failed");
          console.log(`shared sealed input ${blindInputSha256}`);
          NODE
      - name: Normalize vector captures only at compiler boundary
        env:
          MARK_PROPOSAL_BLIND_INPUT: artifacts/mark-conveyor-input-v1/mark-observable-input-blind-v1.json
          MARK_V7_COMPILER_INPUT: artifacts/mark-conveyor-input-v1/mark-observable-input-blind-v1.compiler.json
          MARK_V7_NORMALIZATION_CUSTODY: artifacts/mark-conveyor-input-v1/compiler-normalization-custody.json
        run: node scripts/normalize-mark-v7-compiler-input.mjs
      - name: Verify normalized input custody
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          const input=JSON.parse(fs.readFileSync("artifacts/mark-conveyor-input-v1/mark-observable-input-blind-v1.compiler.json","utf8"));
          const {blindInputSha256,...core}=input;
          const computed=crypto.createHash("sha256").update(JSON.stringify(core)).digest("hex");
          if(!blindInputSha256 || blindInputSha256!==computed) throw new Error("normalized compiler input SHA-256 verification failed");
          const custody=JSON.parse(fs.readFileSync("artifacts/mark-conveyor-input-v1/compiler-normalization-custody.json","utf8"));
          if(custody.compilerBlindInputSha256!==blindInputSha256) throw new Error("normalization custody does not match compiler input");
          console.log(`normalized compiler input ${blindInputSha256}; captures=${custody.captures?.length ?? 0}`);
          NODE
      - name: Build exact row baseline and rowless sufficient-statistics binary
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$MARK_BASELINE_COMMIT"
          rm -rf /tmp/mark-v7-baseline-src
          mkdir -p /tmp/mark-v7-baseline-src
          git archive "$MARK_BASELINE_COMMIT" crates/mark-sparse-compiler \
            | tar -x -C /tmp/mark-v7-baseline-src --strip-components=2
          cargo check --manifest-path /tmp/mark-v7-baseline-src/Cargo.toml
          CARGO_TARGET_DIR=target/mark-v7-baseline cargo build --release --manifest-path /tmp/mark-v7-baseline-src/Cargo.toml
          cp target/mark-v7-baseline/release/mark-sparse-compiler /tmp/mark-v7-baseline
          cargo check --manifest-path crates/mark-sparse-compiler/Cargo.toml
          CARGO_TARGET_DIR=target/mark-v7-sufficient cargo build --release --manifest-path crates/mark-sparse-compiler/Cargo.toml
          cp target/mark-v7-sufficient/release/mark-sparse-compiler /tmp/mark-v7-sufficient
      - name: Run exact row baseline under 512 MB
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/mark-v7-equivalence-baseline
          mkdir -p artifacts/mark-v7-equivalence-baseline
          (
            ulimit -v "$MARK_V7_MAX_RSS_KB"
            /usr/bin/time -v /tmp/mark-v7-baseline compile \
              --input artifacts/mark-conveyor-input-v1/mark-observable-input-blind-v1.compiler.json \
              --out artifacts/mark-v7-equivalence-baseline \
              --tile 512 --overlap 32 --null-iterations 16 --min-sources 3
          ) 2> >(tee artifacts/mark-v7-equivalence-baseline/runtime.txt >&2)
      - name: Preserve baseline sufficient outputs and free redundant grammar rows
        run: |
          mkdir -p artifacts/mark-v7-equivalence-proof/baseline
          cp artifacts/mark-v7-equivalence-baseline/{summary.json,custody.json,evaluation.json,rules.jsonl,runtime.txt} artifacts/mark-v7-equivalence-proof/baseline/
          cp artifacts/mark-conveyor-input-v1/compiler-normalization-custody.json artifacts/mark-v7-equivalence-proof/
          rm -rf artifacts/mark-v7-equivalence-baseline
      - name: Run rowless sufficient-statistics compiler under same 512 MB gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/mark-v7-equivalence-sufficient
          mkdir -p artifacts/mark-v7-equivalence-sufficient
          (
            ulimit -v "$MARK_V7_MAX_RSS_KB"
            /usr/bin/time -v /tmp/mark-v7-sufficient compile \
              --input artifacts/mark-conveyor-input-v1/mark-observable-input-blind-v1.compiler.json \
              --out artifacts/mark-v7-equivalence-sufficient \
              --tile 512 --overlap 32 --null-iterations 16 --min-sources 3
          ) 2> >(tee artifacts/mark-v7-equivalence-sufficient/runtime.txt >&2)
      - name: Prove exact scientific equivalence with zero grammar rows
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const readJson = p => JSON.parse(fs.readFileSync(p,"utf8"));
          const baselineDir="artifacts/mark-v7-equivalence-proof/baseline";
          const sufficientDir="artifacts/mark-v7-equivalence-sufficient";
          const baseline=readJson(`${baselineDir}/summary.json`);
          const sufficient=readJson(`${sufficientDir}/summary.json`);
          const baselineEval=readJson(`${baselineDir}/evaluation.json`);
          const sufficientEval=readJson(`${sufficientDir}/evaluation.json`);
          const baselineCustody=readJson(`${baselineDir}/custody.json`);
          const sufficientCustody=readJson(`${sufficientDir}/custody.json`);
          const normalization=readJson("artifacts/mark-v7-equivalence-proof/compiler-normalization-custody.json");
          const equal=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          const coreFields=["sourceBlindInputSha256","sources","observations","tiles","centers","events","observedPairWeight","unresolvedArms","tileSize","overlap","nullIterations"];
          for(const field of coreFields) if(!equal(baseline[field],sufficient[field])) throw new Error(`sufficient-statistics compiler changed ${field}: baseline=${baseline[field]} sufficient=${sufficient[field]}`);
          if(!equal(baselineEval,sufficientEval)) throw new Error("sufficient-statistics compiler changed transfer evaluation");
          const parseRules=p=>fs.readFileSync(p,"utf8").trim().split(/\n+/).filter(Boolean).map(JSON.parse).sort((a,b)=>a.context.localeCompare(b.context));
          if(!equal(parseRules(`${baselineDir}/rules.jsonl`),parseRules(`${sufficientDir}/rules.jsonl`))) throw new Error("sufficient-statistics compiler changed learned rules or support counts");
          if(baselineCustody.merkleRoot!==sufficientCustody.physicalLedger?.merkleRoot) throw new Error("sufficient-statistics compiler changed physical event ledger custody");
          if(normalization.compilerBlindInputSha256!==sufficient.sourceBlindInputSha256) throw new Error("equivalence proof lost normalization custody");
          if(sufficient.grammarRowsMaterialized!==0) throw new Error(`grammar rows still exist: ${sufficient.grammarRowsMaterialized}`);
          if(sufficient.grammarStatRows<1||sufficient.contextStatRows<1) throw new Error("sufficient-statistics database is empty");
          if(sufficient.grammarContributions!==sufficient.observations*(sufficient.nullIterations+1)) throw new Error("per-observation contribution custody is incomplete");
          if(!sufficientCustody.contract?.grammarSufficientStatisticsDiskBacked||!sufficientCustody.contract?.distinctSourceSupportCommittedAtSourceBoundary||sufficientCustody.contract?.grammarRowsMaterialized) throw new Error("rowless grammar custody contract failed");
          const rss=p=>Number(fs.readFileSync(p,"utf8").match(/Maximum resident set size \(kbytes\):\s*(\d+)/)?.[1]??NaN);
          const wall=p=>fs.readFileSync(p,"utf8").match(/Elapsed \(wall clock\) time \(h:mm:ss or m:ss\):\s*([^\n]+)/)?.[1]?.trim()??null;
          const fsOut=p=>Number(fs.readFileSync(p,"utf8").match(/File system outputs:\s*(\d+)/)?.[1]??NaN);
          const baselineRss=rss(`${baselineDir}/runtime.txt`),sufficientRss=rss(`${sufficientDir}/runtime.txt`);
          if(!Number.isFinite(sufficientRss)||sufficientRss>Number(process.env.MARK_V7_MAX_RSS_KB)) throw new Error(`rowless compiler memory gate failed: ${sufficientRss}`);
          const proof={
            schema:"mark_v7_live_sufficient_statistics_equivalence_v1",
            status:"passed",
            baselineCommit:process.env.MARK_BASELINE_COMMIT,
            sourceBlindInputSha256:sufficient.sourceBlindInputSha256,
            normalizationCustodySha256:normalization.compilerBlindInputSha256,
            normalizedCaptures:normalization.normalizedCaptureCount ?? normalization.captures?.length ?? 0,
            sources:sufficient.sources,
            observations:sufficient.observations,
            centers:sufficient.centers,
            events:sufficient.events,
            observedPairWeight:sufficient.observedPairWeight,
            baselineGrammarRows:baseline.grammarRows,
            sufficientGrammarRowsMaterialized:sufficient.grammarRowsMaterialized,
            sufficientGrammarStatRows:sufficient.grammarStatRows,
            sufficientContextStatRows:sufficient.contextStatRows,
            grammarContributions:sufficient.grammarContributions,
            baselineMaxRssKb:baselineRss,
            sufficientMaxRssKb:sufficientRss,
            baselineWallTime:wall(`${baselineDir}/runtime.txt`),
            sufficientWallTime:wall(`${sufficientDir}/runtime.txt`),
            baselineFilesystemOutputs:fsOut(`${baselineDir}/runtime.txt`),
            sufficientFilesystemOutputs:fsOut(`${sufficientDir}/runtime.txt`),
            physicalLedgerMerkleRoot:sufficientCustody.physicalLedger.merkleRoot,
            grammarContributionMerkleRoot:sufficientCustody.grammarStatistics.contributionMerkleRoot,
            grammarStatisticsDatabaseBytes:sufficientCustody.grammarStatistics.databaseBytes,
            evaluation:sufficientEval
          };
          fs.mkdirSync("artifacts/mark-v7-equivalence-proof",{recursive:true});
          fs.writeFileSync("artifacts/mark-v7-equivalence-proof/equivalence.json",`${JSON.stringify(proof,null,2)}\n`);
          console.log(JSON.stringify(proof,null,2));
          NODE
      - name: Publish equivalence proof
        run: cat artifacts/mark-v7-equivalence-proof/equivalence.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload rowless live equivalence evidence
        uses: actions/upload-artifact@v4
        with:
          name: mark-v7-live-sufficient-statistics-equivalence
          path: |
            artifacts/mark-v7-equivalence-proof/equivalence.json
            artifacts/mark-v7-equivalence-proof/compiler-normalization-custody.json
            artifacts/mark-v7-equivalence-proof/baseline/summary.json
            artifacts/mark-v7-equivalence-proof/baseline/evaluation.json
            artifacts/mark-v7-equivalence-proof/baseline/rules.jsonl
            artifacts/mark-v7-equivalence-proof/baseline/runtime.txt
            artifacts/mark-v7-equivalence-sufficient/summary.json
            artifacts/mark-v7-equivalence-sufficient/evaluation.json
            artifacts/mark-v7-equivalence-sufficient/custody.json
            artifacts/mark-v7-equivalence-sufficient/rules.jsonl
            artifacts/mark-v7-equivalence-sufficient/runtime.txt
            artifacts/mark-v7-equivalence-sufficient/grammar-stats.sqlite
            artifacts/mark-v7-equivalence-sufficient/grammar-contributions.jsonl
          if-no-files-found: error
          retention-days: 30
