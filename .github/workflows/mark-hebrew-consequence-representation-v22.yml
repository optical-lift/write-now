name: Mark Hebrew Consequence Representation v22

on:
  pull_request:
    paths:
      - "scripts/mark_hebrew_consequence_representation_v22_core.py"
      - "scripts/freeze-mark-hebrew-consequence-representation-v22.py"
      - "scripts/evaluate-mark-hebrew-consequence-representation-v22.py"
      - "research/mark/discovery-experiments/hebrew-consequence-representation-v22.protocol.json"
      - "research/mark/discovery-experiments/hebrew-consequence-representation-v22.baseline.json"
      - ".github/workflows/mark-hebrew-consequence-representation-v22.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

env:
  MARK_V22_PROTOCOL: research/mark/discovery-experiments/hebrew-consequence-representation-v22.protocol.json
  MARK_V22_BASELINE: research/mark/discovery-experiments/hebrew-consequence-representation-v22.baseline.json
  MARK_V21_RUN_ID: 33986094131
  MARK_V20_RUN_ID: 33979557978
  MARK_V10_RUN_ID: 33905459943

jobs:
  freeze:
    name: Freeze all nine Hebrew operator/consequence cells before evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate V22 protocol and code before data acquisition
        run: |
          python3 -m json.tool "$MARK_V22_PROTOCOL" >/dev/null
          python3 -m json.tool "$MARK_V22_BASELINE" >/dev/null
          python3 -m py_compile \
            scripts/mark_hebrew_consequence_representation_v22_core.py \
            scripts/freeze-mark-hebrew-consequence-representation-v22.py \
            scripts/evaluate-mark-hebrew-consequence-representation-v22.py
      - name: Download exact frozen V21 Hebrew TRAIN representation packet
        uses: actions/download-artifact@v4
        with:
          name: mark-hebrew-operator-representation-v21-hebrew-train
          path: artifact-staging/hebrew-train
          repository: optical-lift/write-now
          run-id: ${{ env.MARK_V21_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download exact inherited V20 freeze
        uses: actions/download-artifact@v4
        with:
          name: mark-context-conditioned-operator-v20-freeze
          path: artifact-staging/v20-freeze
          repository: optical-lift/write-now
          run-id: ${{ env.MARK_V20_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Prove evaluation lanes are absent
        run: |
          test -z "$(find artifact-staging -type f \( -name 'holdout.jsonl' -o -name 'control.jsonl' \) -print -quit)"
          echo "evaluation_visible_to_freeze=false"
      - name: Freeze V22 consequence-representation matrix
        env:
          PYTHONPATH: scripts
          MARK_V22_HEBREW_TRAIN: artifact-staging/hebrew-train
          MARK_V22_V20_FREEZE: artifact-staging/v20-freeze
          MARK_V22_FREEZE_OUT: artifacts/mark-hebrew-consequence-representation-v22/freeze
        run: python3 scripts/freeze-mark-hebrew-consequence-representation-v22.py
      - name: Publish pre-evaluation freeze summary
        run: cat artifacts/mark-hebrew-consequence-representation-v22/freeze/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mark-hebrew-consequence-representation-v22-freeze
          path: artifacts/mark-hebrew-consequence-representation-v22/freeze/**
          if-no-files-found: error
          retention-days: 30

  evaluate:
    name: Test which Hebrew consequence resolution makes context predictive
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable V22 freeze first
        uses: actions/download-artifact@v4
        with:
          name: mark-hebrew-consequence-representation-v22-freeze
          path: artifact-staging/freeze
      - name: Open exact inherited V21 Hebrew sealed evaluation packet only after freeze
        uses: actions/download-artifact@v4
        with:
          name: mark-hebrew-operator-representation-v21-hebrew-sealed-evaluation
          path: artifact-staging/hebrew-eval
          repository: optical-lift/write-now
          run-id: ${{ env.MARK_V21_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Open reused V10 glyph sealed evaluation only after freeze
        uses: actions/download-artifact@v4
        with:
          name: mark-glyph-transition-code-v10-sealed-evaluation
          path: artifact-staging/glyph-eval
          repository: optical-lift/write-now
          run-id: ${{ env.MARK_V10_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Prove training data and raw OSHB source are absent
        run: |
          test -z "$(find artifact-staging/hebrew-eval artifact-staging/glyph-eval -type f -name 'train.jsonl' -print -quit)"
          test ! -d artifact-staging/morphhb
          echo "train_visible_to_evaluation=false"
      - name: Evaluate frozen V22 matrix and paired axes
        env:
          PYTHONPATH: scripts
          MARK_V22_FREEZE: artifact-staging/freeze
          MARK_V22_HEBREW_EVAL: artifact-staging/hebrew-eval
          MARK_V22_GLYPH_EVAL: artifact-staging/glyph-eval
          MARK_V22_RESULT_OUT: artifacts/mark-hebrew-consequence-representation-v22/result
        run: python3 scripts/evaluate-mark-hebrew-consequence-representation-v22.py
      - name: Publish result summary
        run: cat artifacts/mark-hebrew-consequence-representation-v22/result/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish frozen result on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file artifacts/mark-hebrew-consequence-representation-v22/result/summary.md --edit-last --create-if-none
      - uses: actions/upload-artifact@v4
        with:
          name: mark-hebrew-consequence-representation-v22-frozen
          path: artifacts/mark-hebrew-consequence-representation-v22/**
          if-no-files-found: error
          retention-days: 30
