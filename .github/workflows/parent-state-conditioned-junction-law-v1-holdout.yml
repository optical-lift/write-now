name: Parent-State Conditioned Junction Law v1 — Holdout Validation

on:
  pull_request:
    paths:
      - "research/mark/discovery-experiments/parent-state-conditioned-junction-train-freeze-v1.json"
      - "scripts/validate-parent-state-conditioned-junction-holdout-v1.py"
      - "scripts/measure-parent-state-conditioned-junction-v1.py"
      - "scripts/prepare-parent-state-map-v1.py"
      - "scripts/prepare-parent-state-targets-v1.py"
      - "scripts/prepare-component-placement-map-v1.py"
      - "scripts/prepare-whole-topology-condition-v1.py"
      - "crates/mark-sparse-compiler/src/**"
      - ".github/workflows/parent-state-conditioned-junction-law-v1-holdout.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  holdout-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEALED_RUN_ID: "33755743472"
      SEALED_ARTIFACT: "mark-source-rule-atlas-v1-sealed-evidence"
      SEALED_INPUT: "artifact-staging/sealed-evidence/mark-conveyor-input-v1/mark-observable-input-blind-v1.compiler.json"
      CAPTURES_DIR: "artifact-staging/sealed-evidence/mark-conveyor-input-v1/captures"
      EXCLUDED: "research/mark/discovery-experiments/independent-source-law-discovery-v1.source-selection.json"
      PROTOCOL: "research/mark/discovery-experiments/parent-state-conditioned-junction-law-v1.protocol.json"
      TRAIN_FREEZE: "research/mark/discovery-experiments/parent-state-conditioned-junction-train-freeze-v1.json"
      PLACEMENT_RUN_ID: "33794464849"
      PLACEMENT_ARTIFACT: "mark-masked-slot-substitutability-v1-frozen"
      LOCAL_STATE_RUN_ID: "33767475851"
      LOCAL_STATE_ARTIFACT: "mark-local-state-field-v1-frozen"
      TRAIN_RUN_ID: "35458024645"
      TRAIN_ARTIFACT: "parent-state-conditioned-junction-law-v1-train"

    steps:
      - uses: actions/checkout@v4

      - name: Validate frozen contracts
        run: |
          python3 -m json.tool "$PROTOCOL" >/dev/null
          python3 -m json.tool "$TRAIN_FREEZE" >/dev/null
          python3 -m py_compile scripts/prepare-parent-state-map-v1.py
          python3 -m py_compile scripts/prepare-parent-state-targets-v1.py
          python3 -m py_compile scripts/prepare-component-placement-map-v1.py
          python3 -m py_compile scripts/prepare-whole-topology-condition-v1.py
          python3 -m py_compile scripts/measure-parent-state-conditioned-junction-v1.py
          python3 -m py_compile scripts/validate-parent-state-conditioned-junction-holdout-v1.py
          cargo test --manifest-path crates/mark-sparse-compiler/Cargo.toml --bin mark-sparse-compiler

      - name: Download exact sealed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact-staging/sealed-evidence
          gh run download "$SEALED_RUN_ID" --repo "${{ github.repository }}" --name "$SEALED_ARTIFACT" --dir artifact-staging/sealed-evidence

      - name: Download frozen relational instruments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact-staging/masked-placement artifact-staging/local-state
          gh run download "$PLACEMENT_RUN_ID" --repo "${{ github.repository }}" --name "$PLACEMENT_ARTIFACT" --dir artifact-staging/masked-placement
          gh run download "$LOCAL_STATE_RUN_ID" --repo "${{ github.repository }}" --name "$LOCAL_STATE_ARTIFACT" --dir artifact-staging/local-state
          echo "86f15b922a27e01fed291ad02aacd0ea1a91c1626a5fb1a2fc622985f5d1d4e6  artifact-staging/masked-placement/masked-slot-occurrences.jsonl" | sha256sum -c -
          echo "af381222aa0268a569c05b86b5952c56726318ac2ca43769afd8e097360ae695  artifact-staging/local-state/observation-local-states.jsonl" | sha256sum -c -

      - name: Download exact frozen train result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact-staging/train-freeze
          gh run download "$TRAIN_RUN_ID" --repo "${{ github.repository }}" --name "$TRAIN_ARTIFACT" --dir artifact-staging/train-freeze
          echo "c592bcc71c8f0cebb3c48052a8e17eb5dd26483bc4ba9ab7ff5bf88d8efd708c  artifact-staging/train-freeze/train-catalogue.json" | sha256sum -c -
          echo "29413c49200b80a5bdb8dadcc7366b009b6842f45d6fd60969e221e68041ae61  artifact-staging/train-freeze/target-set.json" | sha256sum -c -

      - name: Rebuild exact frozen relational maps
        run: |
          python3 scripts/prepare-component-placement-map-v1.py \
            --occurrences artifact-staging/masked-placement/masked-slot-occurrences.jsonl \
            --protocol "$PROTOCOL" \
            --out artifacts/pscjl-v1/placement-map.json
          python3 scripts/prepare-parent-state-map-v1.py \
            --occurrences artifact-staging/masked-placement/masked-slot-occurrences.jsonl \
            --observation-states artifact-staging/local-state/observation-local-states.jsonl \
            --protocol "$PROTOCOL" \
            --out artifacts/pscjl-v1/parent-state-map.json

      - name: Prepare untouched holdout sources only
        run: |
          python3 scripts/prepare-whole-topology-condition-v1.py \
            --sealed-input "$SEALED_INPUT" \
            --captures-dir "$CAPTURES_DIR" \
            --excluded-selection "$EXCLUDED" \
            --lane holdout \
            --out artifacts/pscjl-v1/inputs/holdout

      - name: Build parent-state-conditioned compiler
        run: cargo build --release --manifest-path crates/mark-sparse-compiler/Cargo.toml --bin mark-sparse-compiler

      - name: Compile and measure holdout independently
        shell: bash
        run: |
          set -euo pipefail
          input_root="artifacts/pscjl-v1/inputs/holdout"
          out_root="artifacts/pscjl-v1/holdout"
          mkdir -p "$out_root"
          python3 - "$input_root/manifest.json" > "$out_root/sources.tsv" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          for s in d["sources"]:
              print(s["sourceGroupId"]+"\t"+s["localBlindInputSha256"])
          PY
          : > "$out_root/source-metrics.jsonl"
          while IFS=$'\t' read -r sid local_sha; do
            tmp="$RUNNER_TEMP/pscjl-holdout-$sid"
            rm -rf "$tmp"; mkdir -p "$tmp"
            if ! (
              ulimit -v 524288
              crates/mark-sparse-compiler/target/release/mark-sparse-compiler compile \
                --input "$input_root/$sid/input.json" \
                --out "$tmp/compiler" \
                --tile 512 --overlap 32 --null-iterations 64 --min-sources 1 \
                --condition-degree \
                --placement-map artifacts/pscjl-v1/placement-map.json \
                --placement-original-lane holdout \
                --parent-state-map artifacts/pscjl-v1/parent-state-map.json \
                --parent-state-original-lane holdout
            ) > "$tmp/runtime.txt" 2>&1; then
              cat "$tmp/runtime.txt"; exit 1
            fi
            python3 scripts/measure-parent-state-conditioned-junction-v1.py \
              --compiler-out "$tmp/compiler" --source-id "$sid" --lane holdout \
              --local-input-sha "$local_sha" --protocol "$PROTOCOL" \
              --target-set artifact-staging/train-freeze/target-set.json \
              >> "$out_root/source-metrics.jsonl"
            rm -rf "$tmp"
          done < "$out_root/sources.tsv"

      - name: Freeze holdout validation
        run: |
          python3 scripts/validate-parent-state-conditioned-junction-holdout-v1.py \
            --metrics-glob "artifacts/pscjl-v1/holdout/source-metrics.jsonl" \
            --train-catalogue artifact-staging/train-freeze/train-catalogue.json \
            --train-freeze "$TRAIN_FREEZE" \
            --parent-state-map artifacts/pscjl-v1/parent-state-map.json \
            --target-set artifact-staging/train-freeze/target-set.json \
            --protocol "$PROTOCOL" \
            --out artifacts/pscjl-v1/holdout/holdout-validation.json
          cp artifacts/pscjl-v1/inputs/holdout/manifest.json artifacts/pscjl-v1/holdout/input-manifest.json

      - name: Publish compact holdout summary
        run: |
          python3 - artifacts/pscjl-v1/holdout/holdout-validation.json >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); s=d["summary"]
          print("### Parent-State Conditioned Junction Law v1 — HOLDOUT")
          print(f"- Validation SHA-256: `{d['holdoutValidationSha256']}`")
          print(f"- Candidate pass / fail / insufficient: {s['passed']} / {s['failed']} / {s['insufficient']}")
          print(f"- Train one-sided targets reproduced: {s['oneSidedReproduced']} / {s['oneSidedTrainTargets']}")
          print(f"- Mixed tested parent-state subcells: {s['mixedTestedParentStateSubcells']}")
          print("- Strong branch-selector hypothesis remains falsified from train.")
          print("- Control remains unopened.")
          PY

      - name: Upload frozen holdout result
        uses: actions/upload-artifact@v4
        with:
          name: parent-state-conditioned-junction-law-v1-holdout
          path: artifacts/pscjl-v1/holdout/**
          if-no-files-found: error
          retention-days: 30
