name: Mark Hebrew Glyph Exact V15 Ablation v18

on:
  pull_request:
    paths:
      - "scripts/mark_hebrew_glyph_exact_v15_ablation_v18_core.py"
      - "scripts/prepare-mark-hebrew-custody-v18.py"
      - "scripts/freeze-mark-hebrew-glyph-exact-v15-ablation-v18.py"
      - "scripts/evaluate-mark-hebrew-glyph-exact-v15-ablation-v18.py"
      - "research/mark/discovery-experiments/hebrew-glyph-exact-v15-ablation-v18.protocol.json"
      - ".github/workflows/mark-hebrew-glyph-exact-v15-ablation-v18.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

env:
  MARK_V18_PROTOCOL: research/mark/discovery-experiments/hebrew-glyph-exact-v15-ablation-v18.protocol.json
  MARK_V10_RUN_ID: 33905459943
  OSHB_COMMIT: 3d15126fb1ef74867fc1434be1942e837932691f
  OSHB_TREE: 50e6be1d06a80cef7d9285b3c8e4dff47e420bf6
  OSHB_EXOD_BLOB: 9397e001f25d14353793a3924d4e9c605cecfc6c

jobs:
  hebrew-custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m json.tool "$MARK_V18_PROTOCOL" >/dev/null
          python3 -m py_compile scripts/mark_hebrew_glyph_exact_v15_ablation_v18_core.py scripts/prepare-mark-hebrew-custody-v18.py scripts/freeze-mark-hebrew-glyph-exact-v15-ablation-v18.py scripts/evaluate-mark-hebrew-glyph-exact-v15-ablation-v18.py
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-staging/morphhb
          git -C artifact-staging/morphhb init -q
          git -C artifact-staging/morphhb remote add origin https://github.com/openscriptures/morphhb.git
          git -C artifact-staging/morphhb fetch -q --depth=1 origin "$OSHB_COMMIT"
          git -C artifact-staging/morphhb checkout -q --detach FETCH_HEAD
          test "$(git -C artifact-staging/morphhb rev-parse HEAD)" = "$OSHB_COMMIT"
          test "$(git -C artifact-staging/morphhb rev-parse HEAD^{tree})" = "$OSHB_TREE"
          test "$(git -C artifact-staging/morphhb hash-object wlc/Exod.xml)" = "$OSHB_EXOD_BLOB"
      - env:
          PYTHONPATH: scripts
          MARK_V18_WLC: artifact-staging/morphhb/wlc
          MARK_V18_HEBREW_OUT: artifact-staging/hebrew-all
        run: python3 scripts/prepare-mark-hebrew-custody-v18.py
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-staging/hebrew-train artifact-staging/hebrew-eval
          cp artifact-staging/hebrew-all/train.jsonl artifact-staging/hebrew-train/train.jsonl
          cp artifact-staging/hebrew-all/manifest.json artifact-staging/hebrew-train/manifest.json
          cp artifact-staging/hebrew-all/holdout.jsonl artifact-staging/hebrew-eval/holdout.jsonl
          cp artifact-staging/hebrew-all/control.jsonl artifact-staging/hebrew-eval/control.jsonl
          cp artifact-staging/hebrew-all/manifest.json artifact-staging/hebrew-eval/manifest.json
          rm -rf artifact-staging/hebrew-all artifact-staging/morphhb
          test ! -e artifact-staging/hebrew-train/holdout.jsonl
          test ! -e artifact-staging/hebrew-train/control.jsonl
          test ! -e artifact-staging/hebrew-eval/train.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: mark-hebrew-glyph-v18-hebrew-train
          path: artifact-staging/hebrew-train/**
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: mark-hebrew-glyph-v18-hebrew-sealed-evaluation
          path: artifact-staging/hebrew-eval/**
          if-no-files-found: error
          retention-days: 30

  freeze:
    needs: hebrew-custody
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mark-hebrew-glyph-v18-hebrew-train
          path: artifact-staging/hebrew-train
      - uses: actions/download-artifact@v4
        with:
          name: mark-glyph-transition-code-v10-train
          path: artifact-staging/glyph-train
          repository: optical-lift/write-now
          run-id: ${{ env.MARK_V10_RUN_ID }}
          github-token: ${{ github.token }}
      - run: |
          test -z "$(find artifact-staging -type f \( -name 'holdout.jsonl' -o -name 'control.jsonl' \) -print -quit)"
          echo "evaluation_visible_to_freeze=false"
      - env:
          PYTHONPATH: scripts
          MARK_V18_HEBREW_TRAIN: artifact-staging/hebrew-train
          MARK_V18_GLYPH_TRAIN: artifact-staging/glyph-train
          MARK_V18_FREEZE_OUT: artifacts/mark-hebrew-glyph-exact-v15-ablation-v18/freeze
        run: python3 scripts/freeze-mark-hebrew-glyph-exact-v15-ablation-v18.py
      - run: cat artifacts/mark-hebrew-glyph-exact-v15-ablation-v18/freeze/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mark-hebrew-glyph-exact-v15-ablation-v18-freeze
          path: artifacts/mark-hebrew-glyph-exact-v15-ablation-v18/freeze/**
          if-no-files-found: error
          retention-days: 30

  evaluate:
    needs: [hebrew-custody,freeze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mark-hebrew-glyph-exact-v15-ablation-v18-freeze
          path: artifact-staging/freeze
      - uses: actions/download-artifact@v4
        with:
          name: mark-hebrew-glyph-v18-hebrew-sealed-evaluation
          path: artifact-staging/hebrew-eval
      - uses: actions/download-artifact@v4
        with:
          name: mark-glyph-transition-code-v10-sealed-evaluation
          path: artifact-staging/glyph-eval
          repository: optical-lift/write-now
          run-id: ${{ env.MARK_V10_RUN_ID }}
          github-token: ${{ github.token }}
      - run: |
          test -z "$(find artifact-staging/hebrew-eval artifact-staging/glyph-eval -type f -name 'train.jsonl' -print -quit)"
          echo "train_visible_to_evaluation=false"
      - env:
          PYTHONPATH: scripts
          MARK_V18_FREEZE: artifact-staging/freeze
          MARK_V18_HEBREW_EVAL: artifact-staging/hebrew-eval
          MARK_V18_GLYPH_EVAL: artifact-staging/glyph-eval
          MARK_V18_RESULT_OUT: artifacts/mark-hebrew-glyph-exact-v15-ablation-v18/result
        run: python3 scripts/evaluate-mark-hebrew-glyph-exact-v15-ablation-v18.py
      - run: cat artifacts/mark-hebrew-glyph-exact-v15-ablation-v18/result/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file artifacts/mark-hebrew-glyph-exact-v15-ablation-v18/result/summary.md --edit-last --create-if-none
      - uses: actions/upload-artifact@v4
        with:
          name: mark-hebrew-glyph-exact-v15-ablation-v18-frozen
          path: artifacts/mark-hebrew-glyph-exact-v15-ablation-v18/**
          if-no-files-found: error
          retention-days: 30
