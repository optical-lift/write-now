name: Mark Relational Program Discovery v6

on:
  pull_request:
    paths:
      - "scripts/lib/mark-relational-core.mjs"
      - "scripts/build-mark-relational-graphs.mjs"
      - "scripts/discover-mark-relational-programs.mjs"
      - "scripts/evaluate-mark-relational-transfer.mjs"
      - "scripts/report-mark-relational-programs.mjs"
      - "scripts/assert-mark-relational-kernel.mjs"
      - "scripts/test-mark-relational-core.mjs"
      - "scripts/harvest-mark-sources.mjs"
      - "scripts/propose-mark-observables.mjs"
      - "scripts/finalize-mark-harvest-rejoin.mjs"
      - "scripts/expand-mark-open-access-feed.mjs"
      - "scripts/compose-mark-real-corpus-challenge.mjs"
      - "research/mark/harvest-feeds/**"
      - "research/mark/harvest-manifests/v5-fixture-**"
      - "research/mark/feed-fixtures/v5/**"
      - "docs/mark-relational-program-discovery-v6.md"
      - ".github/workflows/mark-relational-program-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relational-program-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Validate relational kernel syntax and invariance contract
        run: |
          npm run check:mark-harvests
          node --check scripts/lib/mark-relational-core.mjs
          node --check scripts/build-mark-relational-graphs.mjs
          node --check scripts/discover-mark-relational-programs.mjs
          node --check scripts/evaluate-mark-relational-transfer.mjs
          node --check scripts/report-mark-relational-programs.mjs
          node --check scripts/assert-mark-relational-kernel.mjs
          node scripts/test-mark-relational-core.mjs
      - name: Expand live heterogeneous source feeds
        if: github.event_name == 'workflow_dispatch'
        run: |
          MARK_OPEN_ACCESS_FEED_REQUEST=research/mark/harvest-feeds/aic-firehose-train.v1.json MARK_OPEN_ACCESS_FEED_OUT=artifacts/v6-feed-aic node scripts/expand-mark-open-access-feed.mjs
          MARK_OPEN_ACCESS_FEED_REQUEST=research/mark/harvest-feeds/cleveland-firehose-train.v1.json MARK_OPEN_ACCESS_FEED_OUT=artifacts/v6-feed-cleveland node scripts/expand-mark-open-access-feed.mjs
          MARK_OPEN_ACCESS_FEED_REQUEST=research/mark/harvest-feeds/met-firehose-holdout.v1.json MARK_OPEN_ACCESS_FEED_OUT=artifacts/v6-feed-met node scripts/expand-mark-open-access-feed.mjs
          MARK_OPEN_ACCESS_FEED_REQUEST=research/mark/harvest-feeds/loc-photos-control.v1.json MARK_OPEN_ACCESS_FEED_OUT=artifacts/v6-feed-loc node scripts/expand-mark-open-access-feed.mjs
      - name: Compose synthetic custody-safe CI packet
        if: github.event_name != 'workflow_dispatch'
        env:
          MARK_CHALLENGE_ID: mark:v6-fixture:relational-kernel-ci
          MARK_CHALLENGE_MANIFESTS: research/mark/harvest-manifests/v5-fixture-train-a.v1.json,research/mark/harvest-manifests/v5-fixture-train-b.v1.json,research/mark/harvest-manifests/v5-fixture-holdout.v1.json,research/mark/harvest-manifests/v5-fixture-control.v1.json
        run: node scripts/compose-mark-real-corpus-challenge.mjs
      - name: Compose live sealed transfer packet
        if: github.event_name == 'workflow_dispatch'
        env:
          MARK_CHALLENGE_ID: mark:v6:open-access-relational-firehose-v1
          MARK_CHALLENGE_MANIFESTS: artifacts/v6-feed-aic/generated-harvest-manifest.v1.json,artifacts/v6-feed-cleveland/generated-harvest-manifest.v1.json,artifacts/v6-feed-met/generated-harvest-manifest.v1.json,artifacts/v6-feed-loc/generated-harvest-manifest.v1.json
        run: node scripts/compose-mark-real-corpus-challenge.mjs
      - name: Harvest exact physical custody and reject duplicate witnesses
        env:
          MARK_HARVEST_MANIFEST: artifacts/mark-real-corpus-challenge-v1/generated-challenge-harvest-manifest.v1.json
          MARK_CONTINUITY_KEY: mark-v6-${{ github.run_id }}-${{ github.sha }}
          MARK_NEAR_DUPLICATE_BITS: 2
        run: node scripts/harvest-mark-sources.mjs
      - name: Let Mark propose multiscale physical units without semantic boundaries
        env:
          MARK_MAX_COMPONENTS_PER_SOURCE: 32
        run: node scripts/propose-mark-observables.mjs
      - name: Seal source and observation custody before relational discovery
        run: node scripts/finalize-mark-harvest-rejoin.mjs
      - name: Convert physical observations into blind relational graphs
        env:
          MARK_RELATIONAL_INPUT: artifacts/mark-conveyor-input-v1/mark-observable-input-blind-v1.json
        run: node scripts/build-mark-relational-graphs.mjs
      - name: Freeze anonymous relational primitives programs and grammar from training only
        env:
          MARK_RELATIONAL_MIN_SOURCES: 3
        run: node scripts/discover-mark-relational-programs.mjs
      - name: Predict masked relations in both sealed transfer lanes and degree-preserving rewires
        env:
          MARK_RELATIONAL_REWIRE_ITERATIONS: 16
        run: node scripts/evaluate-mark-relational-transfer.mjs
      - name: Assert architecture only
        run: node scripts/assert-mark-relational-kernel.mjs
      - name: Reopen provenance only after blind world and transfer evidence are sealed
        run: node scripts/report-mark-relational-programs.mjs
      - name: Publish v6 summaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for summary in \
            artifacts/mark-real-corpus-challenge-v1/summary.txt \
            artifacts/mark-conveyor-input-v1/summary.txt \
            artifacts/mark-relational-graphs-v1/summary.txt \
            artifacts/mark-relational-world-v1/summary.txt \
            artifacts/mark-relational-transfer-v1/summary.txt \
            artifacts/mark-relational-report-v1/summary.txt; do
            if [[ -s "$summary" ]]; then
              echo "### $summary" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload blind relational evidence without source pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mark-v6-blind-relational
          path: |
            artifacts/mark-harvest-v1/mark-harvested-sources-blind-v1.json
            artifacts/mark-conveyor-input-v1/mark-observable-input-blind-v1.json
            artifacts/mark-relational-graphs-v1/*.json
            artifacts/mark-relational-world-v1/*.json
            artifacts/mark-relational-transfer-v1/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload post-freeze relational context report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mark-v6-context-report
          path: |
            artifacts/mark-harvest-rejoin-v1/*.json
            artifacts/mark-conveyor-rejoin-v1/*.json
            artifacts/mark-relational-report-v1/*
          if-no-files-found: warn
          retention-days: 30
